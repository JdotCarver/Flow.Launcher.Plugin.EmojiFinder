name: ci

# publish.yml only runs on main, which leaves pull requests with no signal at all.
# This workflow is the safety net: lint, test and build every change before it lands.

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.17.0'
          cache: npm
      - name: Install dependencies
        run: npm ci
      # What ships to users must be clean: this fails the build.
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=moderate
      # Dev tooling vulnerabilities cannot reach a user's machine, but they can reach
      # the developer's: report them without blocking a release.
      - name: Audit development dependencies
        run: npm audit --audit-level=high
        continue-on-error: true
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm run test
      - name: Build
        run: npm run build

  # Runs on the maintainer's Windows machine, where PowerShell, the clipboard and Flow
  # Launcher actually exist. Opt-in per commit so a normal push does not tie up their PC:
  # include [windows] anywhere in the commit message.
  #
  # workflow_dispatch only works once this file is on the default branch, which is why the
  # commit-message trigger exists for feature branches.
  windows:
    if: >
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.head_commit.message, '[windows]')
    runs-on: [self-hosted, Windows, X64, flowlauncher]
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Node version
        run: node --version

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

      # The helper is generated by our code and cannot be executed anywhere else.
      - name: Paste helper, for real
        run: npm run check:paste-helper
        continue-on-error: true

      - name: Installation doctor
        run: npm run doctor
        continue-on-error: true

      - name: Windows environment probe
        run: npm run diagnose
        continue-on-error: true

      # The real experiment behind the paste bug: run the plugin's own spawn function and
      # compare it with the same script under one changed spawn option at a time.
      - name: Paste helper spawn probe
        run: npm run check:paste-spawn
        continue-on-error: true

      # Logs and artifacts are served from hosts an agent sandbox cannot reach (Azure blob
      # storage), but git is always reachable. Publishing to a branch is what lets the
      # agent read the evidence instead of asking the maintainer to paste it.
      #
      # The step's own failure is reported as an annotation as well: an annotation is
      # readable through the API, so a broken publisher still explains itself.
      - name: Publish reports to the dogfood-reports branch
        if: always()
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # No interactive prompt: with a credential manager in the way, a failed push
          # would wait for a user who is not there.
          GIT_TERMINAL_PROMPT: 0
        run: |
          set -o pipefail
          # Built from $PWD, never from $RUNNER_TEMP: on Windows that variable holds a
          # D:\... path, which bash cannot mkdir or cd into.
          reports="$PWD/../dogfood-reports"
          rm -rf "$reports"
          mkdir -p "$reports"
          if [ -d dogfood ]; then cp -r dogfood/. "$reports/"; fi
          {
            echo "commit: $GITHUB_SHA"
            echo "run: $GITHUB_RUN_ID"
            echo "runner: $RUNNER_NAME"
            echo "when: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } > "$reports/context.txt"

          publish() {
            cd "$reports" || return 1
            git init -q || return 1
            git checkout -q -B dogfood-reports || return 1
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A || return 1
            git commit -q -m "dogfood: reports from ${GITHUB_SHA:0:7}" || echo "nothing new to publish"
            git -c credential.helper= push -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" dogfood-reports
          }

          if ! output=$(publish 2>&1); then
            printf '%s\n' "$output" | tail -20
            first_line=$(printf '%s\n' "$output" | grep -v '^$' | tail -1 | sed 's/%/%25/g; s/\r//g')
            echo "::error title=publish failed::$first_line"
            exit 1
          fi
          printf '%s\n' "$output" | tail -5
