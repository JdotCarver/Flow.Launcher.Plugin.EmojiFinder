name: ci

# publish.yml only runs on main, which leaves pull requests with no signal at all.
# This workflow is the safety net: lint, test and build every change before it lands.

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.17.0'
          cache: npm
      - name: Install dependencies
        run: npm ci
      # What ships to users must be clean: this fails the build.
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=moderate
      # Dev tooling vulnerabilities cannot reach a user's machine, but they can reach
      # the developer's: report them without blocking a release.
      - name: Audit development dependencies
        run: npm audit --audit-level=high
        continue-on-error: true
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm run test
      - name: Build
        run: npm run build

  # Runs on the maintainer's Windows machine, where PowerShell, the clipboard and Flow
  # Launcher actually exist. Opt-in per commit so a normal push does not tie up their PC:
  # include [windows] anywhere in the commit message.
  #
  # workflow_dispatch only works once this file is on the default branch, which is why the
  # commit-message trigger exists for feature branches.
  windows:
    if: >
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.head_commit.message, '[windows]')
    runs-on: [self-hosted, Windows, X64, flowlauncher]
    permissions:
      contents: write

    steps:
      # Two commits of history, because the install decision below diffs HEAD against its
      # parent. The default depth of 1 made that diff fail silently, so a commit that changed
      # src/ reported "0 files changed" and the machine was never updated.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Node version
        run: node --version

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

      # Runs before the agent check: diagnose copies the agent log, and the check writes its
      # own requests into that same log. Copying first keeps the user's real attempts.
      - name: Windows environment probe
        run: npm run diagnose
        continue-on-error: true

      # The agent is generated by our code and can only be exercised on Windows: start it,
      # give it a request, and check that it refuses to paste while the clipboard does not
      # hold the emoji.
      # Not continue-on-error: this is the only place the agent is proven to work, and it
      # proves it once per installed PowerShell host. A red job here is a real regression.
      - name: Paste agent, for real
        run: npm run check:paste-agent

      # Aliases and the empty-query history, measured on the machine that runs the plugin:
      # search cost per keystroke with and without them, the whole-process cost, and the two
      # new surfaces end to end (results Flow can rank, and the right-arrow menu).
      - name: Ranking and aliases, for real
        run: npm run check:ranking

      - name: Installation doctor
        id: doctor
        run: npm run doctor
        continue-on-error: true

      # Is this commit something the installed copy should have? Anything under src/, the
      # settings template or the manifest is, because this runner is also the dogfooding
      # machine. [install] forces it for a commit that changes none of those.
      #
      # Without this the machine kept running an hour-old build while the change under test
      # sat in the repository: the context menu did not change, the settings did not change,
      # and the only clue was one FAIL line in a log the sandbox cannot open.
      - name: Does the installed copy need this commit?
        id: changes
        shell: powershell
        run: |
          # Never let this step be the reason nothing was installed: it is a decision, and a
          # decision that cannot be made falls back to installing (see the step condition).
          $ErrorActionPreference = 'Continue'

          $message = (git log -1 --format=%B 2>$null) -join "`n"
          $files = @(git diff --name-only 'HEAD~1' 'HEAD' 2>$null)
          $pluginFiles = @($files | Where-Object { $_ -match '^(src/|plugin\.json$|SettingsTemplate\.yaml$|package\.json$)' })
          $forced = $message.Contains('[install]')
          $doctorFailed = '${{ steps.doctor.outcome }}' -eq 'failure'
          $needs = $forced -or ($pluginFiles.Count -gt 0) -or $doctorFailed

          Write-Host "::notice title=install::changed files that affect the installed copy: $($pluginFiles.Count) of $($files.Count); forced: $forced; doctor failed: $doctorFailed; needs install: $needs"
          Add-Content -Path $env:GITHUB_OUTPUT -Value ("needs_install=" + $needs.ToString().ToLower()) -Encoding utf8
          exit 0

      # Installs the freshly built plugin into this machine's Flow Launcher, with tracing
      # on, so a fix can be tried by hand straight away.
      - name: Install into Flow Launcher
        # Fail-open: only an explicit "false" skips the install.
        if: steps.changes.outputs.needs_install != 'false'
        run: npm run package -- --install --trace
        continue-on-error: true

      # The doctor above runs before the install, so it can only describe the old folder.
      # This one is what proves a fresh install is complete: manifest, dist, and the
      # production dependencies the plugin cannot run without.
      - name: Installation doctor (after install)
        if: steps.changes.outputs.needs_install != 'false'
        run: npm run doctor
        continue-on-error: true

      # Which shells this machine actually has. The publish step originally failed with no
      # output whatsoever, which is what "the shell itself could not be started" looks like:
      # worth one line of evidence rather than another guess.
      - name: Shell availability
        if: always()
        shell: powershell
        run: |
          $bash = Get-Command bash -ErrorAction SilentlyContinue
          if ($null -eq $bash) {
            Write-Host '::notice title=shell::bash not found on PATH'
          } else {
            Write-Host "::notice title=shell::bash at $($bash.Source)"
          }

      # Logs and artifacts are served from hosts an agent sandbox cannot reach (Azure blob
      # storage), but git is always reachable. Publishing to a branch is what lets the
      # agent read the evidence instead of asking the maintainer to paste it.
      #
      # Every stage announces itself with a notice annotation, and a failure is repeated as
      # an error annotation. Annotations are served by api.github.com, so even a broken
      # publisher can explain itself to someone who cannot open the log. Windows PowerShell,
      # not bash or pwsh: 5.1 ships with every Windows install, the other two do not.
      - name: Publish reports to the dogfood-reports branch
        if: always()
        shell: powershell
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # No interactive prompt: with a credential manager in the way, a failed push
          # would wait for a user who is not there.
          GIT_TERMINAL_PROMPT: 0
        run: |
          # The runner's PowerShell wrapper sets $ErrorActionPreference = 'stop', which makes
          # any native command that writes to stderr a terminating error. `git push` writes
          # its progress to stderr and succeeds, so with the default the script died silently
          # right after committing - no checkpoint, no annotation.
          $ErrorActionPreference = 'Continue'

          function Write-Checkpoint([string] $stage) {
            Write-Host "::notice title=publish::stage=$stage"
          }

          function Write-Failure([string] $stage, [string] $detail) {
            $cleaned = ($detail -replace '%', '%25') -replace '\r?\n', ' '
            Write-Host "::error title=publish failed at $stage::$($cleaned.Substring(0, [Math]::Min(900, $cleaned.Length)))"
            exit 1
          }

          # One level up from the checkout, so the report repository never nests inside ours.
          $reports = Join-Path (Split-Path (Get-Location).Path -Parent) 'dogfood-reports'
          Write-Checkpoint "reports=$reports"

          if (Test-Path $reports) { Remove-Item $reports -Recurse -Force }
          New-Item -ItemType Directory -Path $reports | Out-Null
          if (Test-Path 'dogfood') {
            Copy-Item -Path 'dogfood\*' -Destination $reports -Recurse -Force
          }

          @(
            "commit: $env:GITHUB_SHA",
            "run: $env:GITHUB_RUN_ID",
            "runner: $env:RUNNER_NAME",
            "when: $((Get-Date).ToUniversalTime().ToString('yyyy-MM-ddTHH:mm:ssZ'))"
          ) | Set-Content -Path (Join-Path $reports 'context.txt')
          Write-Checkpoint "copied $((Get-ChildItem $reports -Recurse -File).Count) files"

          Push-Location $reports
          try {
            git init -q
            if ($LASTEXITCODE -ne 0) { Write-Failure 'git init' "exit $LASTEXITCODE" }

            git checkout -q -B dogfood-reports
            if ($LASTEXITCODE -ne 0) { Write-Failure 'git checkout' "exit $LASTEXITCODE" }

            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

            git add -A
            if ($LASTEXITCODE -ne 0) { Write-Failure 'git add' "exit $LASTEXITCODE" }

            git commit -q -m "dogfood: reports from $($env:GITHUB_SHA.Substring(0, 7))"
            Write-Checkpoint 'committed'

            Write-Checkpoint 'pushing'
            $url = "https://x-access-token:$($env:GITHUB_TOKEN)@github.com/$($env:GITHUB_REPOSITORY).git"
            $pushOutput = git -c credential.helper= push -f $url dogfood-reports 2>&1 | Out-String
            # Never let a failure message echo the token back out.
            $pushOutput = $pushOutput -replace [regex]::Escape($env:GITHUB_TOKEN), '***'
            if ($LASTEXITCODE -ne 0) { Write-Failure 'git push' $pushOutput }

            Write-Checkpoint 'pushed dogfood-reports'
          } finally {
            Pop-Location
          }

          # The runner's PowerShell wrapper exits with $LASTEXITCODE when it is set, so a
          # successful run is ended explicitly rather than inherited from git.
          exit 0
