name: ci

# publish.yml only runs on main, which leaves pull requests with no signal at all.
# This workflow is the safety net: lint, test and build every change before it lands.

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.17.0'
          cache: npm
      - name: Install dependencies
        run: npm ci
      # What ships to users must be clean: this fails the build.
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=moderate
      # Dev tooling vulnerabilities cannot reach a user's machine, but they can reach
      # the developer's: report them without blocking a release.
      - name: Audit development dependencies
        run: npm audit --audit-level=high
        continue-on-error: true
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm run test
      - name: Build
        run: npm run build
