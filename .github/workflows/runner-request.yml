# .github/workflows/runner-request.yml
#
# One explicit Windows run per request commit, dispatched by a push.
#
#   bash tools/github_actions_runner/request_run.sh local-windows "Job Name"
#
# The request script rewrites .github/runner-request.toml and pushes it; that
# path is the only trigger, so ordinary commits never start a run. The planner
# validates the request and picks the runner labels, the workload runs on that
# runner, and the exporter republishes every job's log to the `actions-logs`
# branch because artifact and signed-URL downloads are blocked in the sandbox
# (see tools/github_actions_runner/AGENTS.md).
#
# The workload is this repository's verification: lint, unit tests, the build,
# the paste agent and the ranking checks for real, then the environment probe and
# the installation doctor. Replace those steps when the question changes; keep the
# planner and the exporter.

name: Runner request

on:
  push:
    paths:
      - .github/runner-request.toml

concurrency:
  group: runner-request-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  select-runner:
    name: Select runner
    runs-on: ubuntu-24.04
    outputs:
      request_id: ${{ steps.request.outputs.request_id }}
      target: ${{ steps.request.outputs.target }}
      workload_name: ${{ steps.request.outputs.workload_name }}
      runner_labels: ${{ steps.request.outputs.runner_labels }}
    steps:
      - name: Check out the request commit
        uses: actions/checkout@v4

      - name: Validate the request
        id: request
        run: python3 tools/github_actions_runner/select_runner.py .github/runner-request.toml >> "$GITHUB_OUTPUT"

      - name: Report the selection
        run: |
          echo "target: ${{ steps.request.outputs.target }}"
          echo "labels: ${{ steps.request.outputs.runner_labels }}"
          echo "workload: ${{ steps.request.outputs.workload_name }}"

  workload:
    name: ${{ needs.select-runner.outputs.workload_name }}
    needs: select-runner
    runs-on: ${{ fromJSON(needs.select-runner.outputs.runner_labels) }}
    timeout-minutes: 30
    steps:
      - name: Check out the request commit
        uses: actions/checkout@v4
        with:
          # The benchmark extracts the published code from origin/main, so the
          # whole history has to be here.
          fetch-depth: 0

      # GitHub-hosted runners are bare, so they need a Python installed. The
      # session runner is a real desktop that already has one -- and
      # actions/setup-python cannot install there: it asks for registry access it
      # does not have, then retries for twenty minutes before failing.
      - name: Install Python (hosted runners only)
        if: needs.select-runner.outputs.target != 'local-windows'
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Resolve the Python to run with
        shell: pwsh
        run: |
          $resolved = $null
          foreach ($candidate in @('py', 'python', 'python3')) {
            $command = Get-Command $candidate -ErrorAction SilentlyContinue
            if (-not $command) { continue }
            $executable = & $command.Source -c "import sys; print(sys.executable)" 2>$null
            if ($LASTEXITCODE -eq 0 -and $executable) {
              $resolved = "$executable".Trim()
              break
            }
          }
          if (-not $resolved) { throw "No usable Python found on this runner." }
          "PYTHON=$resolved" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          & $resolved --version

      - name: Environment
        shell: pwsh
        run: |
          # Family and architecture only: an exact build is a finding aid, not a finding.
          # These logs are republished to a public branch.
          $node = node --version
          $shells = @()
          foreach ($candidate in @('powershell.exe', 'pwsh.exe')) {
            $command = Get-Command $candidate -ErrorAction SilentlyContinue
            if (-not $command) { continue }
            $version = & $candidate -NoProfile -NonInteractive -Command '$PSVersionTable.PSVersion.ToString()' 2>$null
            $shells += "$candidate $version"
          }
          Write-Host ("os: {0} | arch: {1} | node: {2}" -f [System.Environment]::OSVersion.VersionString, $env:PROCESSOR_ARCHITECTURE, $node)
          Write-Host ("powershell hosts: {0}" -f ($shells -join ', '))

      - name: Runner receipt
        run: |
          & $env:PYTHON tools/github_actions_runner/probe.py .github/runner-request.toml

      - name: Runner tool tests
        run: |
          & $env:PYTHON -m unittest discover -s tools/github_actions_runner -p "test_*.py" -v

      # Everything below is this repository's own verification, on the machine that has
      # PowerShell, the clipboard, SendKeys and Flow Launcher. A red step here is a real
      # regression: nothing is continue-on-error unless it only produces evidence.
      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

      # The only place the generated PowerShell is proven, once per installed host. Includes
      # the focus gate: with every process counted as Flow Launcher, the agent must refuse to
      # paste even when the clipboard holds the emoji it was asked for.
      - name: Paste agent, for real
        run: npm run check:paste-agent

      # Aliases, the empty-query history, the context menu and the action keyword, measured
      # on the machine that runs the plugin.
      - name: Ranking and aliases, for real
        run: npm run check:ranking

      # Evidence, not a verdict: the probe copies this machine's live state, including the
      # paste agent's own log, into dogfood/.
      - name: Windows environment probe
        run: npm run diagnose
        continue-on-error: true

      # This machine is also the dogfooding machine. A verification run that leaves the old build
      # installed verifies the wrong thing the next time the user presses Enter - which is
      # exactly what happened here: the doctor found an agent script from 2026-10-23 on disk
      # while the build under test was new. The installer stops and restarts the agent, so the
      # running process picks up the script this commit generates.
      - name: Install into Flow Launcher
        run: npm run package -- --install
        continue-on-error: true

      # continue-on-error on purpose: it reports on the *installed* copy, and an installation
      # that failed for reasons of its own is reported rather than made the workload's verdict.
      - name: Installation doctor (after install)
        run: npm run doctor
        continue-on-error: true

      # The tail of the agent's log is printed here rather than uploaded, because artifact
      # downloads are blocked in the sandbox and there is no other way for the agent to read
      # it. It contains process ids, window handles and emoji code points - never a window
      # title - and the exporter replaces the account name.
      - name: Paste agent log tail from this machine
        if: always()
        shell: pwsh
        run: |
          $log = Join-Path $env:LOCALAPPDATA 'Flow.Launcher.Plugin.EmojiFinder\agent.log'
          if (-not (Test-Path $log)) {
            Write-Host 'no agent log: the paste agent has never run on this machine'
            exit 0
          }
          $lines = Get-Content -LiteralPath $log -Tail 120
          Write-Host "--- last $($lines.Count) lines of the agent log ---"
          foreach ($line in $lines) { Write-Host $line }

      # The reports are written into the runner's own workspace, which disappears with it, and
      # artifact downloads are blocked in the sandbox. Printing them is what makes a green run
      # citable: which findings passed, and the numbers the ranking check measured.
      - name: Evidence
        if: always()
        shell: pwsh
        run: |
          foreach ($report in @('paste-agent-check.json', 'ranking-check.json')) {
            $path = Join-Path 'dogfood' $report
            if (-not (Test-Path $path)) {
              Write-Host "--- no ${report} ---"
              continue
            }
            Write-Host "--- $report ---"
            $json = Get-Content -LiteralPath $path -Raw | ConvertFrom-Json
            # Two report shapes: the paste check says ok=<bool>, the ranking check says
            # kind=pass/fail. Printing either with the wrong field name reports 22 passing
            # findings as failures, which is what the first version of this step did.
            $findings = if ($report -eq 'paste-agent-check.json') {
              foreach ($hostResult in $json.results) { $hostResult.findings }
            } else {
              $json.findings
            }
            foreach ($finding in $findings) {
              $passed = if ($null -ne $finding.ok) { [bool]$finding.ok } else { $finding.kind -eq 'pass' }
              $detail = if ($finding.detail) { " - $($finding.detail)" } elseif ($finding.message) { " - $($finding.message)" } else { '' }
              Write-Host ("  {0} {1}{2}" -f $(if ($passed) { 'ok  ' } else { 'FAIL' }), $finding.label, $detail)
            }
          }

      # The exporter publishes the planner's log but not this job's, so the reports are pushed
      # to a branch instead - the same mechanism the ci workflow uses, and the only route the
      # sandbox can read (artifact downloads are blocked, `gh run view --log` follows a signed
      # URL it cannot reach). Nothing secret is in these files: the paste agent logs process ids
      # and window handles, never a window title.
      - name: Publish the reports to the dogfood-reports branch
        if: always()
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GIT_TERMINAL_PROMPT: 0
        run: |
          $ErrorActionPreference = 'Continue'

          $reports = Join-Path (Split-Path (Get-Location).Path -Parent) 'dogfood-reports'
          if (Test-Path $reports) { Remove-Item $reports -Recurse -Force }
          New-Item -ItemType Directory -Path $reports | Out-Null
          if (Test-Path 'dogfood') {
            Copy-Item -Path 'dogfood\*' -Destination $reports -Recurse -Force
          }

          @(
            "commit: $env:GITHUB_SHA",
            "run: $env:GITHUB_RUN_ID",
            "runner: $env:RUNNER_NAME",
            "via: runner-request",
            "when: $((Get-Date).ToUniversalTime().ToString('yyyy-MM-ddTHH:mm:ssZ'))"
          ) | Set-Content -Path (Join-Path $reports 'context.txt')

          Push-Location $reports
          try {
            git init -q
            git checkout -q -B dogfood-reports
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add -A
            git commit -q -m "dogfood: reports from $($env:GITHUB_SHA.Substring(0, 7)) (runner-request)"
            $url = "https://x-access-token:$($env:GITHUB_TOKEN)@github.com/$($env:GITHUB_REPOSITORY).git"
            $output = git -c credential.helper= push -f $url dogfood-reports 2>&1 | Out-String
            $output = $output -replace [regex]::Escape($env:GITHUB_TOKEN), '***'
            if ($LASTEXITCODE -ne 0) {
              Write-Host "::error title=publish failed::$($output -replace '\r?\n', ' ')"
            }
          } finally {
            Pop-Location
          }
          exit 0

      - name: Read the verdict
        if: always()
        run: npm run dogfood:check

  export-logs:
    name: Export logs
    needs:
      - select-runner
      - workload
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the request commit
        uses: actions/checkout@v4

      - name: Publish this run's logs to the actions-logs branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 tools/github_actions_runner/export_logs.py --exporter-name "Export logs"
