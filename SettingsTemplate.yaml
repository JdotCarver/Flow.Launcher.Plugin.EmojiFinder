body:
  - type: checkbox
    attributes:
      name: enableNotification
      label: Show a system notification when selecting an emoji
      description: "Useful when starting. You can turn this off when unneeded for the fastest possible copy."
      defaultValue: true
  - type: dropdown
    attributes:
      name: defaultAction
      label: Enter Mode
      description: "Copy Mode only puts the emoji in your clipboard. Paste Mode also makes it's best effort to paste it at your cursor location."
      defaultValue: Copy Mode
      options:
        - Copy Mode
        - Paste Mode
  - type: dropdown
    attributes:
      name: maxResults
      label: Maximum number of emoji to show
      description: "Due to the amount of emojis, a broad query can match thousands of results. So a lower value is recommended for snappier results. This defaults to 25, which is about two screens."
      defaultValue: "25"
      options:
        - "10"
        - "25"
        - "50"
        - "100"
        - "250"
