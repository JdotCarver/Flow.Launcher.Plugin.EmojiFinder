body:
  - type: checkbox
    attributes:
      name: enableNotification
      label: Show a system notification when selecting an emoji
      description: "Useful when starting. You can turn this off when unneeded for the fastest possible copy."
      defaultValue: true
  - type: dropdown
    attributes:
      name: defaultAction
      label: What pressing Enter does
      description: "Copy puts the emoji on your clipboard. Paste at cursor also types Ctrl+V, so the emoji lands where you are typing. Paste does nothing in windows running as administrator, because Windows blocks input from non-elevated apps."
      defaultValue: copy
      options:
        - copy
        - paste
  - type: dropdown
    attributes:
      name: maxResults
      label: Maximum number of emoji to show
      description: "Due to the amount of emojis, a broad query can match thousands of results. So a lower value is recommended for snappier results. Defaults to 25, which is about two screens."
      defaultValue: "25"
      options:
        - "10"
        - "25"
        - "50"
        - "100"
        - "250"
